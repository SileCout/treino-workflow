<html lan=" pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>preencha seus dados</title>

  <link rel="stylesheet" href="Untitled-1.css">
</head>
<body>

  <!-- estrutura da seção -->
   <section CLASS="dados" id="dados">
    <div class="dados_container">
      <h2 class="dados_titulo">preencha seus dados</h2>
      <p class="dados_subtitulo">informe seus dados de contato abaixo.</p>

      <form class="dados_form" id="formdados"novalidate>
        <div class="dados_campo">
          <label for="nome">nome completo</label>
          <input type="text" id="nome"name="name"placholder="ex.: maria da silva" autocomplete="name">
          <span class="dados_erro" id="erro-name"></span>
        </div>

        <div class="dados_campo">
          <label for="telefone">Telefone</label>
          <input type="tel" id="telefone" name="telefone" placeholder="(00) 0000-0000" inputmode="numeric" autocomplete="tel" maxlength="15">
          <span class="dados_erro" id="erro-telefone"></span>
        </div>

        <div class="dados_campo">
          <label for="emial">E-mail</label>
          <input type="email" id="email" name="email" placeholder="seuemail@exemplo.com" autocomplete="email">
          <span class="dados_erro" id="erro-email"></span>
        </div>

        <button type="submit" class="dados_botao">enviar</button>
        <div class="dados_sucesso" id="mensagemsucesso">Dados enviados com sucesso</div>
      </form>
    </div>
   </section>

   <!-- JavaScript: validação e comportamento (fica no final para o HTML carregar primeiro) -->
  <script src="script.js"></script>
</body>
</html>
